services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: plantmonitoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plantmonitoring"]
      interval: 2s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/plantmonitoring
      ASSISTANT_API_TOKEN: ${ASSISTANT_API_TOKEN}
      INGEST_API_TOKEN: ${INGEST_API_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      SENSOR_API_URL: ${SENSOR_API_URL:-}
      SENSOR_API_KEY: ${SENSOR_API_KEY:-}
      SENSOR_SENSORS: ${SENSOR_SENSORS:-[]}
      XIAOMI_SENSORS: ${XIAOMI_SENSORS:-[]}
      IMPORT_SCAN_PATH: ${IMPORT_SCAN_PATH:-}
      IMPORT_SCAN_MAX_FILES: ${IMPORT_SCAN_MAX_FILES:-1000}
      IMPORT_SCAN_CACHE_TTL_SECONDS: ${IMPORT_SCAN_CACHE_TTL_SECONDS:-600}
      CAPTURE_STALE_MINUTES: ${CAPTURE_STALE_MINUTES:-90}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data/photos:/app/data/photos
      - ./data/thumbs:/app/data/thumbs
      - ./scripts:/app/scripts
      - ./docs:/app/docs:ro
      - ./data/tagging-runs:/app/data/tagging-runs
      - type: bind
        source: /media
        target: /media
        read_only: true
        bind:
          propagation: rslave
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  pi:
    build: ./pi
    volumes:
      - ./pi:/app

  # Offline stabilization worker (OpenCV); run on a schedule, never with `up`.
  #   docker compose run --rm stabilizer
  # registers pending/new Pi frames onto the reference and writes their transforms.
  stabilizer:
    build:
      context: .
      dockerfile: Dockerfile.stabilizer
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/plantmonitoring
    volumes:
      - ./data/photos:/app/data/photos
      - ./scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
