name: CI

on:
  push:
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run backend tests
        run: |
          docker compose -p plant-monitoring-test -f docker-compose.test.yml \
            run --rm backend pytest tests/ -v --cov=app --cov-report=term-missing
          docker compose -p plant-monitoring-test -f docker-compose.test.yml down -v

  test-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run pi tests
        run: docker compose run --rm pi pytest tests/ -v

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run JS tests
        run: npm test
        working-directory: backend
