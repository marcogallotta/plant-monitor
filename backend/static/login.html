<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Plant Monitoring — Sign in</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121212;
      color: #ddd;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 340px;
      margin: 1rem;
      padding: 1.75rem;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.25rem;
    }
    p.sub {
      margin: 0 0 1.25rem;
      color: #888;
      font-size: 0.85rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 0.35rem;
    }
    input[type="password"] {
      width: 100%;
      background: #121212;
      border: 1px solid #444;
      color: #eee;
      padding: 0.55rem 0.65rem;
      border-radius: 6px;
      font-size: 1rem;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: #8af;
    }
    button {
      width: 100%;
      margin-top: 1rem;
      padding: 0.6rem;
      background: #2b6cff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover { background: #3b78ff; }
    .error {
      display: none;
      margin-bottom: 1rem;
      padding: 0.5rem 0.65rem;
      background: #3a1a1a;
      border: 1px solid #7a2a2a;
      color: #f3b0b0;
      border-radius: 6px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌱 Plant Monitoring</h1>
    <p class="sub">Sign in to continue</p>
    <div class="error" id="error">Incorrect password. Try again.</div>
    <form method="post" action="/login">
      <input type="hidden" name="next" id="next" value="/">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" autocomplete="current-password" autofocus required>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const next = params.get("next");
    if (next && next.startsWith("/") && !next.startsWith("//")) {
      document.getElementById("next").value = next;
    }
    if (params.get("error")) {
      document.getElementById("error").style.display = "block";
    }
  </script>
</body>
</html>
