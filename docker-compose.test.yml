services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_DB: plantmonitoring_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plantmonitoring_test"]
      interval: 2s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db-test:5432/plantmonitoring_test
    volumes:
      - ./backend:/app
    depends_on:
      db-test:
        condition: service_healthy
